78899b" text-anchor="start" font-weight="400">nothing to bite on. Cost: bandwidth and latency.</text><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">What the adversary actually sees</text><text x="978" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="end" font-weight="400">a global passive observer, watching every link</text></svg>