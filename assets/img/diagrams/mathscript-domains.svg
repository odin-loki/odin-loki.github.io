<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="MathScript's six library domains over an in-tree linear algebra core, with Result&lt;T&gt; error handling throughout"><title>MathScript's six library domains over an in-tree linear algebra core, with Result&lt;T&gt; error handling throughout</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="62" width="306" height="82" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="22" y="62" width="3" height="82" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="38" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Core systems</text><text x="38" y="105" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">dense + sparse linalg</text><text x="38" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">LU · QR · SVD · eig · Cholesky</text><rect x="350" y="62" width="306" height="82" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="350" y="62" width="3" height="82" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="366" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Numerical</text><text x="366" y="105" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">ODE · PDE · FEM · CFD</text><text x="366" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">special functions, quadrature</text><rect x="678" y="62" width="306" height="82" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="678" y="62" width="3" height="82" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="694" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Statistics &amp; ML</text><text x="694" y="105" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">distributions, inference</text><text x="694" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">regression, optimisation</text><rect x="22" y="158" width="306" height="82" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="22" y="158" width="3" height="82" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="38" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Applied</text><text x="38" y="201" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">signal · image</text><text x="38" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">control · finance</text><rect x="350" y="158" width="306" height="82" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="350" y="158" width="3" height="82" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1"/><text x="366" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Symbolic</text><text x="366" y="201" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">computer algebra</text><text x="366" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">alongside the numerics</text><rect x="678" y="158" width="306" height="82" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="678" y="158" width="3" height="82" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1"/><text x="694" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Specialised</text><text x="694" y="201" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">graphs · geometry</text><text x="694" y="216" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">topology · quantum</text><rect x="22" y="258" width="956" height="34" rx="8" fill="#182029" stroke="#33455a" stroke-width="1"/><text x="38" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5eead4" text-anchor="start" font-weight="400">Result&lt;T&gt; — no exceptions, no raw pointers, no unsafe casts</text><text x="962" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="end" font-weight="400">35 static libraries · 816 CTest suites</text><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">One library, six domains</text><text x="978" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="end" font-weight="400">no Eigen, no OpenBLAS — the kernels are in-tree</text></svg>