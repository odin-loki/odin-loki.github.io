<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Licensing decision: individuals, charities, education and organisations under AUD 50,000 use AGPL-3.0+ free; everyone else, and anyone needing private modifications, takes a commercial licence"><title>Licensing decision: individuals, charities, education and organisations under AUD 50,000 use AGPL-3.0+ free; everyone else, and anyone needing private modifications, takes a commercial licence</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="96" width="210" height="86" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="22" y="96" width="3" height="86" rx="1.5" fill="#78899b" stroke="none" stroke-width="1"/><text x="38" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing="1.2">START</text><text x="38" y="136" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Who are you?</text><text x="38" y="155" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">individual · charity</text><text x="38" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">education · company</text><line x1="238" y1="139" x2="288" y2="139" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="294" y="62" width="210" height="76" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="294" y="62" width="3" height="76" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="310" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Under AUD 50,000/yr?</text><text x="310" y="105" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">or not a company at all</text><rect x="294" y="160" width="210" height="76" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="294" y="160" width="3" height="76" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="310" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">AUD 50,000 or more</text><text x="310" y="203" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">or modifications must stay private</text><line x1="510" y1="100" x2="560" y2="100" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="510" y1="198" x2="560" y2="198" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="566" y="62" width="412" height="76" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="566" y="62" width="3" height="76" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="582" y="81" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1.2">NO COST</text><text x="582" y="102" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">AGPL-3.0 or later — free</text><text x="582" y="121" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Publish modifications · keep the attribution line · network use counts as distribution</text><rect x="566" y="160" width="412" height="76" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="566" y="160" width="3" height="76" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="582" y="179" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a78bfa" text-anchor="start" font-weight="400" letter-spacing="1.2">QUOTED PER ENQUIRY</text><text x="582" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Commercial licence</text><text x="582" y="219" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Keep modifications private · no copyleft reach · tiered by organisation size</text><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">Which licence applies to you</text><text x="22" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">HardenedBSD-derived code in ParanoidBSD stays BSD and is covered by neither.</text></svg>