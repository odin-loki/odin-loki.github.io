<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="The SENTINEL pipeline from ingest through models to ranked leads, with a provenance rail running underneath every stage"><title>The SENTINEL pipeline from ingest through models to ranked leads, with a provenance rail running underneath every stage</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="66" width="178" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="22" y="66" width="3" height="108" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="38" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1.2">INGEST</text><text x="38" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Sources</text><text x="38" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">UK Police API, CSV,</text><text x="38" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">weather · quality scoring</text><line x1="203" y1="120" x2="213" y2="120" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="218" y="66" width="178" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="218" y="66" width="3" height="108" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="234" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1.2">NLP</text><text x="234" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Rule-based</text><text x="234" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">modus operandi,</text><text x="234" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">crime classification</text><line x1="399" y1="120" x2="409" y2="120" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="414" y="66" width="178" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="414" y="66" width="3" height="108" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="430" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a78bfa" text-anchor="start" font-weight="400" letter-spacing="1.2">MODELS</text><text x="430" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Statistical</text><text x="430" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Poisson · Hawkes · DBSCAN</text><text x="430" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">KDE · Gaussian process</text><line x1="595" y1="120" x2="605" y2="120" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="610" y="66" width="178" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="610" y="66" width="3" height="108" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="626" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a78bfa" text-anchor="start" font-weight="400" letter-spacing="1.2">INFERENCE</text><text x="626" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Analysis</text><text x="626" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Rossmo profiling, MO,</text><text x="626" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">co-offending PageRank</text><line x1="791" y1="120" x2="801" y2="120" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="806" y="66" width="178" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="806" y="66" width="3" height="108" rx="1.5" fill="#fbbf24" stroke="none" stroke-width="1"/><text x="822" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#fbbf24" text-anchor="start" font-weight="400" letter-spacing="1.2">OUTPUT</text><text x="822" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Ranked leads</text><text x="822" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">every one traceable to</text><text x="822" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">its source record</text><rect x="22" y="188" width="956" height="34" rx="8" fill="#182029" stroke="#5eead4" stroke-width="1" opacity="0.9"/><text x="38" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5eead4" text-anchor="start" font-weight="400">Provenance chain — source record · model · parameters, at every stage</text><line x1="111.0" y1="174" x2="111.0" y2="188" stroke="#5eead4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.45"/><line x1="307.0" y1="174" x2="307.0" y2="188" stroke="#5eead4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.45"/><line x1="503.0" y1="174" x2="503.0" y2="188" stroke="#5eead4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.45"/><line x1="699.0" y1="174" x2="699.0" y2="188" stroke="#5eead4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.45"/><line x1="895.0" y1="174" x2="895.0" y2="188" stroke="#5eead4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.45"/><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">Ingest to lead, with the receipt attached</text><text x="22" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">If an analyst cannot show why a lead ranked where it did, it should not be a lead. That is why the audit log is one of the nine pages.</text></svg>