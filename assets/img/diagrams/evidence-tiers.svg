<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="The four evidence levels used across the research shelf, from speculative through design and reference implementation to result-bearing"><title>The four evidence levels used across the research shelf, from speculative through design and reference implementation to result-bearing</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="156" width="232" height="34" rx="8" fill="#131b24" stroke="#f87171" stroke-width="1.2"/><text x="36" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#f87171" text-anchor="start" font-weight="600">Speculative</text><text x="36" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">theory or design only</text><rect x="36" y="178" width="13" height="4" rx="2" fill="#f87171" stroke="none" stroke-width="1"/><rect x="54" y="178" width="13" height="4" rx="2" fill="#33455a" stroke="none" stroke-width="1"/><rect x="72" y="178" width="13" height="4" rx="2" fill="#33455a" stroke="none" stroke-width="1"/><rect x="90" y="178" width="13" height="4" rx="2" fill="#33455a" stroke="none" stroke-width="1"/><rect x="274" y="130" width="232" height="60" rx="8" fill="#131b24" stroke="#fbbf24" stroke-width="1.2"/><text x="288" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#fbbf24" text-anchor="start" font-weight="600">Design document</text><text x="288" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">specified; implementation partial</text><rect x="288" y="178" width="13" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1"/><rect x="306" y="178" width="13" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1"/><rect x="324" y="178" width="13" height="4" rx="2" fill="#33455a" stroke="none" stroke-width="1"/><rect x="342" y="178" width="13" height="4" rx="2" fill="#33455a" stroke="none" stroke-width="1"/><rect x="526" y="104" width="232" height="86" rx="8" fill="#131b24" stroke="#60a5fa" stroke-width="1.2"/><text x="540" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#60a5fa" text-anchor="start" font-weight="600">Reference implementation</text><text x="540" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">code exists and runs</text><rect x="540" y="178" width="13" height="4" rx="2" fill="#60a5fa" stroke="none" stroke-width="1"/><rect x="558" y="178" width="13" height="4" rx="2" fill="#60a5fa" stroke="none" stroke-width="1"/><rect x="576" y="178" width="13" height="4" rx="2" fill="#60a5fa" stroke="none" stroke-width="1"/><rect x="594" y="178" width="13" height="4" rx="2" fill="#33455a" stroke="none" stroke-width="1"/><rect x="778" y="78" width="232" height="112" rx="8" fill="#131b24" stroke="#5eead4" stroke-width="1.2"/><text x="792" y="100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#5eead4" text-anchor="start" font-weight="600">Result-bearing</text><text x="792" y="208" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">experiments run, numbers reported</text><rect x="792" y="178" width="13" height="4" rx="2" fill="#5eead4" stroke="none" stroke-width="1"/><rect x="810" y="178" width="13" height="4" rx="2" fill="#5eead4" stroke="none" stroke-width="1"/><rect x="828" y="178" width="13" height="4" rx="2" fill="#5eead4" stroke="none" stroke-width="1"/><rect x="846" y="178" width="13" height="4" rx="2" fill="#5eead4" stroke="none" stroke-width="1"/><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">How to read anything on the research shelf</text><text x="978" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="end" font-weight="400">no item reaches a fifth level</text><text x="22" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">There is no “validated” tier in use, because nothing here has been independently replicated or externally audited.</text></svg>