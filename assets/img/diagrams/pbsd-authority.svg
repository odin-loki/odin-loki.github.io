<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Two authority models compared: under ambient authority a process can name every resource and is refused afterwards; under the handle nucleus it can only name what it holds a handle to"><title>Two authority models compared: under ambient authority a process can name every resource and is refused afterwards; under the handle nucleus it can only name what it holds a handle to</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="56" width="467.0" height="226" rx="14" fill="#0b0f14" stroke="#243141" stroke-width="1"/><text x="42" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" fill="#e8eef4" text-anchor="start" font-weight="600">Ambient authority</text><text x="42" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#fbbf24" text-anchor="start" font-weight="400" letter-spacing="1">TRADITIONAL UNIX</text><rect x="42" y="118" width="108" height="52" rx="8" fill="#131b24" stroke="#33455a" stroke-width="1"/><text x="96" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#e8eef4" text-anchor="middle" font-weight="400">process</text><text x="96" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#78899b" text-anchor="middle" font-weight="400">uid 1001</text><rect x="218" y="112" width="251.0" height="24" rx="6" fill="#131b24" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="228" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">socket()</text><line x1="152" y1="144" x2="214" y2="124" stroke="#fbbf24" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ar)" opacity="0.85"/><rect x="218" y="142" width="251.0" height="24" rx="6" fill="#131b24" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="228" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">execve(&quot;/bin/sh&quot;)</text><line x1="152" y1="144" x2="214" y2="154" stroke="#fbbf24" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ar)" opacity="0.85"/><rect x="218" y="172" width="251.0" height="24" rx="6" fill="#131b24" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="228" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">ptrace(sibling)</text><line x1="152" y1="144" x2="214" y2="184" stroke="#fbbf24" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ar)" opacity="0.85"/><rect x="218" y="202" width="251.0" height="24" rx="6" fill="#131b24" stroke="#f87171" stroke-width="1" opacity="1"/><text x="228" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">/etc/master.passwd</text><line x1="152" y1="144" x2="214" y2="214" stroke="#f87171" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ar)" opacity="0.85"/><text x="459.0" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#f87171" text-anchor="end" font-weight="400">denied after the fact</text><text x="42" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">It can name everything. The check comes after.</text><rect x="511.0" y="56" width="467.0" height="226" rx="14" fill="#0b0f14" stroke="#243141" stroke-width="1"/><text x="531.0" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" fill="#e8eef4" text-anchor="start" font-weight="600">Handle nucleus</text><text x="531.0" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1">PARANOIDBSD</text><rect x="531.0" y="118" width="108" height="52" rx="8" fill="#131b24" stroke="#33455a" stroke-width="1"/><text x="585.0" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#e8eef4" text-anchor="middle" font-weight="400">process</text><text x="585.0" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#78899b" text-anchor="middle" font-weight="400">uid 1001</text><rect x="707.0" y="112" width="251.0" height="24" rx="6" fill="#131b24" stroke="#5eead4" stroke-width="1" opacity="1"/><text x="717.0" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">dir:/var/app → config</text><line x1="641.0" y1="144" x2="703.0" y2="124" stroke="#5eead4" stroke-width="1.1" stroke-linecap="round" marker-end="url(#ar)" opacity="0.85"/><rect x="707.0" y="142" width="251.0" height="24" rx="6" fill="none" stroke="#33455a" stroke-width="1" opacity="0.5"/><text x="717.0" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#78899b" text-anchor="start" font-weight="400">socket()</text><line x1="641.0" y1="144" x2="703.0" y2="154" stroke="#33455a" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.28"/><rect x="707.0" y="172" width="251.0" height="24" rx="6" fill="none" stroke="#33455a" stroke-width="1" opacity="0.5"/><text x="717.0" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#78899b" text-anchor="start" font-weight="400">execve()</text><line x1="641.0" y1="144" x2="703.0" y2="184" stroke="#33455a" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.28"/><rect x="707.0" y="202" width="251.0" height="24" rx="6" fill="none" stroke="#33455a" stroke-width="1" opacity="0.5"/><text x="717.0" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#78899b" text-anchor="start" font-weight="400">/etc/master.passwd</text><line x1="641.0" y1="144" x2="703.0" y2="214" stroke="#33455a" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.28"/><text x="531.0" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">No handle, no name, no request to refuse.</text><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">Where the check happens</text><text x="978" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="end" font-weight="400">solid = the request travels · dashed = it cannot be formed</text></svg>