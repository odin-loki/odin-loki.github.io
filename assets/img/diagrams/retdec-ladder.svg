<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="The abstraction ladder a function climbs: raw bytes, disassembly, lifted IR, C pseudocode, and finally the named algorithm"><title>The abstraction ladder a function climbs: raw bytes, disassembly, lifted IR, C pseudocode, and finally the named algorithm</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="62" width="956" height="44" rx="8" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="22" y="62" width="3" height="44" rx="1.5" fill="#78899b" stroke="none" stroke-width="1"/><text x="38" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#e8eef4" text-anchor="start" font-weight="600">Raw bytes</text><text x="38" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">63 7c 77 7b f2 6b 6f c5</text><line x1="62" y1="107" x2="62" y2="110" stroke="#33455a" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="48" y="112" width="930" height="44" rx="8" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="48" y="112" width="3" height="44" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1"/><text x="64" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#e8eef4" text-anchor="start" font-weight="600">Disassembly</text><text x="64" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">rol eax, 0x8   ; RotWord</text><line x1="88" y1="157" x2="88" y2="160" stroke="#33455a" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="74" y="162" width="904" height="44" rx="8" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="74" y="162" width="3" height="44" rx="1.5" fill="#60a5fa" stroke="none" stroke-width="1"/><text x="90" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#e8eef4" text-anchor="start" font-weight="600">Lifted IR</text><text x="90" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">%rot = fshl.i32(%prev, 8)</text><line x1="114" y1="207" x2="114" y2="210" stroke="#33455a" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="100" y="212" width="878" height="44" rx="8" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="100" y="212" width="3" height="44" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="116" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#e8eef4" text-anchor="start" font-weight="600">C pseudocode</text><text x="116" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">t = (t &lt;&lt; 8) | (t &gt;&gt; 24);</text><line x1="140" y1="257" x2="140" y2="260" stroke="#33455a" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="126" y="262" width="852" height="44" rx="8" fill="#182029" stroke="#fbbf24" stroke-width="1.4"/><rect x="126" y="262" width="3" height="44" rx="1.5" fill="#fbbf24" stroke="none" stroke-width="1"/><text x="142" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#e8eef4" text-anchor="start" font-weight="600">Semantics</text><text x="142" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a3b1c0" text-anchor="start" font-weight="400">AES-128 key expansion, FIPS-197 §5.2</text><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">What a decompiler should return</text><text x="978" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#fbbf24" text-anchor="end" font-weight="400">the last rung is the product</text><text x="22" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">Pseudocode tells you what the bytes do. The semantic layer tells you which specification they implement.</text></svg>