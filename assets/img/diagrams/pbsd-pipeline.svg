<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="The ParanoidBSD port pipeline: inventory, deterministic passes, agent loop, and a verification gate that rejects work back into the loop"><title>The ParanoidBSD port pipeline: inventory, deterministic passes, agent loop, and a verification gate that rejects work back into the loop</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="66" width="214" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="22" y="66" width="3" height="108" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="38" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1.2">STAGE 1</text><text x="38" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Inventory</text><text x="38" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Score every C source</text><text x="38" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">c_inventory.csv</text><line x1="242" y1="120" x2="258" y2="120" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="266" y="66" width="214" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="266" y="66" width="3" height="108" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="282" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1.2">STAGE 2</text><text x="282" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Deterministic passes</text><text x="282" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Safe rewrites, tiers 0–4</text><text x="282" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">No model involved</text><line x1="486" y1="120" x2="502" y2="120" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="510" y="66" width="214" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="510" y="66" width="3" height="108" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="526" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a78bfa" text-anchor="start" font-weight="400" letter-spacing="1.2">STAGE 3</text><text x="526" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Agent loop</text><text x="526" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Fills refusals + stubs</text><text x="526" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">This is what funding buys</text><line x1="730" y1="120" x2="746" y2="120" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="754" y="66" width="214" height="108" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="754" y="66" width="3" height="108" rx="1.5" fill="#fbbf24" stroke="none" stroke-width="1"/><text x="770" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#fbbf24" text-anchor="start" font-weight="400" letter-spacing="1.2">STAGE 4</text><text x="770" y="106" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Verification gate</text><text x="770" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Compile · ASan · UBSan</text><text x="770" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">Differential · IR</text><path d="M861.0 174 L861.0 216 L373.0 216 L373.0 178" fill="none" stroke="#f87171" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M368.0 186 L373.0 176 L378.0 186" fill="none" stroke="#f87171" stroke-width="1.4"/><text x="500.0" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#f87171" text-anchor="middle" font-weight="400">rejected — agent_port_failures.jsonl</text><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">How a file becomes a ported file</text><text x="22" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">A file that only compiles is unverified. Nothing counts as done until differential or IR verification passes.</text></svg>