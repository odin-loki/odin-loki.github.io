<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="How Cypha learned chess: a verified reference engine labels positions, those become features, and Cypha's regression head is fitted to reproduce the engine's evaluation"><title>How Cypha learned chess: a verified reference engine labels positions, those become features, and Cypha's regression head is fitted to reproduce the engine's evaluation</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33455a"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker></defs><rect x="22" y="68" width="178" height="112" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="22" y="68" width="3" height="112" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="38" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1.2">TEACHER</text><text x="38" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Reference engine</text><text x="38" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">0x88, alpha-beta,</text><text x="38" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">quiescence · perft-verified</text><line x1="203" y1="124" x2="213" y2="124" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="218" y="68" width="178" height="112" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="218" y="68" width="3" height="112" rx="1.5" fill="#5eead4" stroke="none" stroke-width="1"/><text x="234" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5eead4" text-anchor="start" font-weight="400" letter-spacing="1.2">DATA</text><text x="234" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">26,568 positions</text><text x="234" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">self-play, randomised</text><text x="234" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">labelled at depth 4</text><line x1="399" y1="124" x2="409" y2="124" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="414" y="68" width="178" height="112" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="414" y="68" width="3" height="112" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="430" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a78bfa" text-anchor="start" font-weight="400" letter-spacing="1.2">FEATURES</text><text x="430" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">388 dimensions</text><text x="430" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">384 piece-square</text><text x="430" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">+ pair, doubled, mobility, phase</text><line x1="595" y1="124" x2="605" y2="124" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="610" y="68" width="178" height="112" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="610" y="68" width="3" height="112" rx="1.5" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="626" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a78bfa" text-anchor="start" font-weight="400" letter-spacing="1.2">FIT</text><text x="626" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">Cypha head</text><text x="626" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">WorldPrior whitening,</text><text x="626" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">NLMS, MDL decay, replay</text><line x1="791" y1="124" x2="801" y2="124" stroke="#33455a" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="806" y="68" width="178" height="112" rx="10" fill="#131b24" stroke="#33455a" stroke-width="1"/><rect x="806" y="68" width="3" height="112" rx="1.5" fill="#fbbf24" stroke="none" stroke-width="1"/><text x="822" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#fbbf24" text-anchor="start" font-weight="400" letter-spacing="1.2">RESULT</text><text x="822" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#e8eef4" text-anchor="start" font-weight="600">9.4 KB of weights</text><text x="822" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">held-out R² 0.866</text><text x="822" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#a3b1c0" text-anchor="start" font-weight="400">5W–19L–6D vs teacher</text><text x="22" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#e8eef4" text-anchor="start" font-weight="600">Distillation, not discovery</text><text x="978" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="end" font-weight="400">the architecture is unchanged — only the features are chess</text><text x="22" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#78899b" text-anchor="start" font-weight="400" letter-spacing=".4">Cypha reproduced an evaluation function it was shown. It did not learn chess from scratch, and nothing here claims it did.</text></svg>